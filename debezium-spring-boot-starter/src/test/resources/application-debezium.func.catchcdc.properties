spring.profiles.include=kafka.dev,kafka.cdc.default

pg.debezium.enabled-kafka-cdc=true

#Function配置
spring.cloud.function.definition=cdcXxlJobGroup;cdcXxlJobLog

#Consumer端Channel配置
# 为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
# spring.cloud.stream.bindings.catchCdc-in-0.binder=kafka
## 属于 Stream Binding的通用配置
# 在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；destination就是exchange/topic的命名
spring.cloud.stream.bindings.cdcXxlJobGroup-in-0.destination=cdc-xxljob.xxljob.xxl_job_group
# 在kafka环境中 group 只用于指定服务实例所属的逻辑组，多个实例时，只有一个实例能够消费destination指定topic中的消息
spring.cloud.stream.bindings.cdcXxlJobGroup-in-0.group=xxl_job_group
spring.cloud.stream.kafka.bindings.cdcXxlJobGroup-in-0.consumer.dlq-name=cdc-xxljob.xxljob.xxl_job_group.dlq

spring.cloud.stream.bindings.cdcXxlJobLog-in-0.destination=cdc-xxljob.xxljob.xxl_job_log
spring.cloud.stream.bindings.cdcXxlJobLog-in-0.group=xxl_job_log
spring.cloud.stream.kafka.bindings.cdcXxlJobLog-in-0.consumer.dlq-name=cdc-xxljob.xxljob.xxl_job_log.dlq