# 默认需要激活的profile
spring.profiles.include=bus.disable,bustream.kafka.bindings.default

pg.debezium.enabled=false
pg.debezium.enabled-j-raft=false
pg.metrics.debezium.enabled=false
management.health.debezium.enabled=false

# 指定默认binder，未定义binder的channel将使用该binder
spring.cloud.stream.default-binder=kafka

spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap