spring.jpa.database=mysql

pg.datasource.dynamic.druid.default-ds.driver-class-name=com.mysql.cj.jdbc.Driver
pg.datasource.dynamic.druid.default-ds.url=jdbc:mysql://127.0.0.1:3306/test1?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Hongkong&zeroDateTimeBehavior=convertToNull
pg.datasource.dynamic.druid.default-ds.username=root
pg.datasource.dynamic.druid.default-ds.password=111111
pg.datasource.dynamic.druid.default-ds.max-active=10
pg.datasource.dynamic.druid.default-ds.min-idle=1
#默认true
#pg.datasource.dynamic.druid.default-ds.default-auto-commit=
#驱逐idle连接的最大最小时间
#默认30分钟；也就是说如果连接30分钟都没有使用到，并且这种连接的数量超过了minIdle，则这些连接就会被关闭了
#pg.datasource.dynamic.druid.default-ds.min-evictable-idle-time-millis=
#默认7小时；也就是说如果连接大于7小时都没有使用到，就会强行关闭，即使空闲的连接数小于minIdle
#pg.datasource.dynamic.druid.default-ds.max-evictable-idle-time-millis=
#驱逐idle连接程执行的间隔时间，默认60秒
#pg.datasource.dynamic.druid.default-ds.time-between-eviction-runs-millis=
#是否保活，默认false
#pg.datasource.dynamic.druid.default-ds.keep-alive=true
#保活线程执行的间隔时间，默认120秒，time-between-eviction-runs-millis的2倍
#pg.datasource.dynamic.druid.default-ds.keep-alive-between-time-millis=
#1.2.6- 建议配置
