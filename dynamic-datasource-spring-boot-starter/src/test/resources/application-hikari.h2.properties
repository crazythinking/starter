#初始化脚本通常只用于自动化测试；不支持多数据源初始化，默认只使用当前默认数据源执行初始化脚本；
spring.sql.init.mode=always
spring.sql.init.encoding=utf-8
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=\
classpath:gm-h2.sql

spring.jpa.database=h2

pg.datasource.dynamic.hikari.default-cf.driver-class-name=org.h2.Driver
pg.datasource.dynamic.hikari.default-cf.jdbc-url=jdbc:h2:mem:memdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
pg.datasource.dynamic.hikari.default-cf.username=sa
pg.datasource.dynamic.hikari.default-cf.password=

pg.datasource.dynamic.hikari.cf-map.one.driver-class-name=org.h2.Driver
pg.datasource.dynamic.hikari.cf-map.one.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
pg.datasource.dynamic.hikari.cf-map.one.username=sa
pg.datasource.dynamic.hikari.cf-map.one.password=

pg.datasource.dynamic.hikari.cf-map.two.driver-class-name=com.mysql.cj.jdbc.Driver
pg.datasource.dynamic.hikari.cf-map.two.jdbc-url=jdbc:mysql://ubuntu.wsl:4306/xxljob?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Hongkong&zeroDateTimeBehavior=convertToNull
pg.datasource.dynamic.hikari.cf-map.two.username=root
pg.datasource.dynamic.hikari.cf-map.two.password=111111

pg.datasource.dynamic.hikari.cf-map.thr.driver-class-name=com.mysql.cj.jdbc.Driver
pg.datasource.dynamic.hikari.cf-map.thr.jdbc-url=jdbc:mysql://ubuntu.wsl:4306/xxljob?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Hongkong&zeroDateTimeBehavior=convertToNull
pg.datasource.dynamic.hikari.cf-map.thr.username=root
pg.datasource.dynamic.hikari.cf-map.thr.password=111111
