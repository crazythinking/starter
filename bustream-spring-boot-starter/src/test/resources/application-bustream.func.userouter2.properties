#Producer端Channel配置

#为Channel指定Binder，这将决定Channel使用哪个MQ
spring.cloud.stream.bindings.user-outer.binder=rabbit
#spring.cloud.stream.bindings.user-outer2.binder=kafka

#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.user-outer2.destination=test.stream.bridge
#通过指定routing-key-expression从MessageHeader中获取自定义key“messageType”，作为routeKey
spring.cloud.stream.rabbit.bindings.user-outer2.producer.routing-key-expression=headers.messageType

# kafka 的 topic 对应的就是 rabbitmq 的 queue
#spring.cloud.stream.bindings.user-outer2.destination=test.stream.bridge.userType2
# 分区数
#spring.cloud.stream.bindings.user-outer2.producer.partition-count=3
# client id 为了监控区分不同客户端
#spring.cloud.stream.kafka.bindings.user-outer2.producer.configuration.client.id=user-outer2

