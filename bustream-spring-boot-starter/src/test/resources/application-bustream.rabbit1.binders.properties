# 自定义Binder，名称为rabbit1
spring.cloud.stream.binders.rabbit1.type=rabbit
# 自定义Binder必须保持此配置，以确保同类型的默认Binder和Binding不会被覆盖，同时确保默认兜底逻辑有效
spring.cloud.stream.binders.rabbit1.default-candidate=false
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.connection-timeout=${spring.rabbitmq.connection-timeout}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.cache.connection.mode=${spring.rabbitmq.cache.connection.mode}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.cache.channel.size=${spring.rabbitmq.cache.channel.size}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.cache.channel.checkout-timeout=${spring.rabbitmq.cache.channel.checkout-timeout}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.virtual-host=${spring.rabbitmq.virtual-host}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.publisher-confirm-type=${spring.rabbitmq.publisher-confirm-type}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.publisher-returns=${spring.rabbitmq.publisher-returns}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.template.mandatory=${spring.rabbitmq.template.mandatory}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.address-shuffle-mode=${spring.rabbitmq.address-shuffle-mode}
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.dynamic=${spring.rabbitmq.dynamic}

spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.addresses=ubuntu.wsl:5676,ubuntu.wsl:5677,ubuntu.wsl:5678
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.password=admin
spring.cloud.stream.binders.rabbit1.environment.spring.rabbitmq.username=admin
