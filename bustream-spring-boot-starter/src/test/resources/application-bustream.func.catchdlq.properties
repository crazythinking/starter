#为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
#spring.cloud.stream.bindings.pollableInput.binder=kafka
#使用自定义binder，bindings.default 和 rabbit.binding.default 中的兜底配置都将失效
spring.cloud.stream.bindings.catchUserDlq-in-0.binder=rabbit

## 属于 Stream Binding的通用配置
#spring.cloud.stream.rabbit.bindings.catchUserDlq-in-0.consumer.exchange-type=direct
#spring.cloud.stream.bindings.catchUserDlq-in-0.destination=DLX
spring.cloud.stream.bindings.catchUserDlq-in-0.group=test.stream.bridge.userType1.dlq
spring.cloud.stream.rabbit.bindings.catchUserDlq-in-0.consumer.binding-routing-key=test.stream.bridge.userType1

