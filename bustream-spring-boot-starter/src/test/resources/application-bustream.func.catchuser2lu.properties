#Producer端配置

#spring.cloud.stream.bindings.catchUser2Lu-in-0.binder=rabbit
#spring.cloud.stream.bindings.catchUser2Lu-in-0.binder=kafka
spring.cloud.stream.bindings.catchUser2Lu-in-0.binder=rabbit2
spring.cloud.stream.bindings.catchUser2Lu-in-0.destination=user-manager
spring.cloud.stream.bindings.catchUser2Lu-in-0.group=addUser2

# 当不使用默认binder（如kafka,rabbit,rocketmq等）或运行时注入多个binder时，消费端必须显示配置如下：
# 默认业务异常不进行重试
spring.cloud.stream.bindings.catchUser2Lu-in-0.consumer.retryable-exceptions.net.engining.pg.support.core.exception.ErrorMessageException=false

# RabbitMQ消费端特性配置
# ms, 默认不做限制, 消息在队列中最大的存活时间; 当消息滞留超过ttl时会被当成消费失败消息, 即会被转发到死信队列或丢弃
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.ttl=${spring.cloud.stream.rabbit.default.consumer.ttl}
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.declare-exchange=${spring.cloud.stream.rabbit.default.consumer.declare-exchange}
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.bind-queue=${spring.cloud.stream.rabbit.default.consumer.bind-queue}
# queue的名称只使用group，不使用destination.group
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.queue-name-group-only=${spring.cloud.stream.rabbit.default.consumer.queue-name-group-only}
# spring-amqp会默认设为true，这里设回false，是为了如果当前连接断开未获取到queue的情况下，不作为致命错误，而是让container不断重试，直到恢复
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.missing-queues-fatal=${spring.cloud.stream.rabbit.default.consumer.missing-queues-fatal}
# 以下配置只用于死信相关
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.auto-bind-dlq=${spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq}
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.republish_to_dlq=${spring.cloud.stream.rabbit.default.consumer.republish_to_dlq}
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.binding-routing-key=type2

# Kafka消费端特性配置
#当Kafka中没有初始偏移量或服务器上不再存在当前consumer对应偏移量时的策略
spring.cloud.stream.kafka.bindings.catchUser2Lu-in-0.consumer.startOffset=${spring.kafka.consumer.auto-offset-reset}
#是否启用DLQ，默认false；如果打开DLQ，其默认TopicName为error.<destination>.<group>，且失败的Event会被发送到DLQ中与原始Event相同的分区号
spring.cloud.stream.kafka.bindings.catchUser2Lu-in-0.consumer.enableDlq=${spring.cloud.stream.kafka.default.consumer.enableDlq}
#当启用DLQ时，通常Kafka的DLQ只用于处理异常的消息，因此数量不会很大，可以使用此参数控制DLQ的分区数量
spring.cloud.stream.kafka.bindings.catchUser2Lu-in-0.consumer.dlqPartitions=${spring.cloud.stream.kafka.default.consumer.dlqPartitions}
#指示是否需要填充标准Header，允许值：none, id, timestamp, or both；默认none
spring.cloud.stream.kafka.bindings.catchUser2Lu-in-0.consumer.standardHeaders=${spring.cloud.stream.kafka.default.consumer.standardHeaders}