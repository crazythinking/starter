#Producer端Channel配置

#spring.cloud.stream.bindings.catchUser2Lu-in-0.binder=rabbitCluster
spring.cloud.stream.bindings.catchUser2Lu-in-0.binder=rabbit
#queue-name-group-only=true：指定consumer绑定的queue-name不使用默认destination.group规则，而直接使用group指定的值
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.queue-name-group-only=true
spring.cloud.stream.bindings.catchUser2Lu-in-0.destination=user-manager
spring.cloud.stream.bindings.catchUser2Lu-in-0.group=luxue
