# 激活组合的profiles
spring.profiles.include=bus.disable,bustream.rabbit.binders,channel.stream.pollinput.rabbit,bustream.common

#为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
#spring.cloud.stream.bindings.pollableInput.binder=kafka
#使用自定义binder，bindings.default 和 rabbit.binding.default 中的兜底配置都将失效
spring.cloud.stream.bindings.pollableInput.binder=rabbitCluster

## 属于 Stream Binding的通用配置
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.exchange-type=direct
spring.cloud.stream.bindings.pollableInput.destination=DLX
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.queue-name-group-only=true
spring.cloud.stream.bindings.pollableInput.group=test.stream.bridge.userType1.dlq

## 属于特定于RabbitMq的Binding,不是通用的(如果涉及到mq的转换则不可用; 同样以key的方式指定配置，默认为spring.cloud.stream.default-binder);
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.acknowledgeMode=AUTO
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.republishToDlq=false
#由于要消费死信队列，所以关闭自动绑定死信队列，且不设置ttl
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.auto-bind-dlq=false
# spring-amqp会默认设为true，这里设回false，是为了如果当前连接断开未获取到queue的情况下，不作为致命错误，而是让container不断重试，直到恢复
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.missing-queues-fatal=true
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.binding-routing-key=test.stream.bridge.userType1
