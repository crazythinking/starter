# 激活组合的profiles
#spring.profiles.include=bus.disable,channel.stream.pollinput.kafka,bustream.common
spring.profiles.include=bus.disable,channel.stream.pollinput.rabbit,bustream.common

#为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
#spring.cloud.stream.bindings.pollableInput.binder=kafka
spring.cloud.stream.bindings.pollableInput.binder=rabbit

## 属于 Stream Binding的通用配置
#queue的后缀, 必须带有业务含义；在topic模式下其还作为分组; 此案例指定消费repayBack的死信队列
spring.cloud.stream.bindings.pollableInput.group=repayBack.dlq

## 属于特定于RabbitMq的Binding,不是通用的(如果涉及到mq的转换则不可用; 同样以key的方式指定配置，默认为spring.cloud.stream.default-binder);
#指定exchange类型direct的相应的配置，不推荐使用，默认使用topic
#spring.cloud.stream.rabbit.bindings.pollableInput.consumer.exchangeType=direct
#spring.cloud.stream.rabbit.bindings.pollableInput.consumer.bindQueue=true
#spring.cloud.stream.rabbit.bindings.pollableInput.consumer.queueNameGroupOnly=true
#spring.cloud.stream.rabbit.bindings.pollableInput.consumer.declareExchange=false
#指定消息进入死信队列的间隔时间
#spring.cloud.stream.rabbit.bindings.pollableInput.consumer.ttl=200000
#只有与指定的routingKey相同的消息才会从exchange转发到该consumer对应的queue; 不配置时routingKey为“#”
#spring.cloud.stream.rabbit.bindings.pollableInput.consumer.binding-routing-key=${spring.cloud.stream.bindings.pollableInput.group}
#由于要消费死信队列，所以关闭自动绑定死信队列，且不设置ttl
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.auto-bind-dlq=false
spring.cloud.stream.rabbit.bindings.pollableInput.consumer.ttl=


## 属于特定于Kafka的Binding,不是通用的(如果涉及到mq的转换则不可用; 同样以key的方式指定配置，默认为spring.cloud.stream.default-binder);
#spring.cloud.stream.kafka.bindings.pollableInput.consumer.configuration.
