# 激活组合的profiles
#spring.profiles.include=bus.disable,bustream.kafka.binders
spring.profiles.include=bus.disable,bustream.rabbit.binders

#Function配置
spring.cloud.function.definition=addUser2;catchUser2;catchUser2Repay1;catchUser2Lu
spring.cloud.stream.poller.fixed-delay=5000

#Producer端Channel配置
#为Channel指定Binder，这将决定Channel使用哪个MQ
#spring.cloud.stream.bindings.addUser2-out-0.binder=kafkaCluster
spring.cloud.stream.bindings.addUser2-out-0.binder=rabbitCluster
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.addUser2-out-0.destination=user-manager
spring.cloud.stream.bindings.addUser2-out-0.producer.error-channel-enabled=true

#为Channel指定Binder，这将决定Channel使用哪个MQ
spring.cloud.stream.bindings.user-outer.binder=rabbitCluster
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.user-outer.destination=test.stream.bridge
spring.cloud.stream.bindings.user-outer.producer.error-channel-enabled=true
#通过指定routing-key-expression从MessageHeader中获取自定义key“messageType”，作为routeKey
spring.cloud.stream.rabbit.bindings.user-outer.producer.routing-key-expression=headers.messageType

spring.cloud.stream.bindings.user-outer2.binder=rabbitCluster
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
#不指定routing-key-expression时默认的routeKey就是destination
spring.cloud.stream.bindings.user-outer2.destination=test.stream.bridge
spring.cloud.stream.bindings.user-outer2.producer.error-channel-enabled=true


#Consumer端Channel配置
#为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
#spring.cloud.stream.bindings.catchUser2-in-0.binder=kafkaCluster
spring.cloud.stream.bindings.catchUser2-in-0.binder=rabbitCluster
## 属于 Stream Binding的通用配置
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.catchUser2-in-0.destination=user-manager
#只指定group，不指定routeKey，则默认routeKey=“#”
spring.cloud.stream.bindings.catchUser2-in-0.group=repayBack

spring.cloud.stream.bindings.catchUser2Repay1-in-0.binder=rabbitCluster
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.catchUser2Repay1-in-0.destination=test.stream.bridge
#指定group和routeKey
spring.cloud.stream.bindings.catchUser2Repay1-in-0.group=user.type
spring.cloud.stream.rabbit.bindings.catchUser2Repay1-in-0.consumer.binding-routing-key=type2

spring.cloud.stream.bindings.catchUser2Lu-in-0.binder=rabbitCluster
#queue-name-group-only=true：指定consumer绑定的queue-name不使用默认destination.group规则，而直接使用group指定的值
spring.cloud.stream.rabbit.bindings.catchUser2Lu-in-0.consumer.queue-name-group-only=true
spring.cloud.stream.bindings.catchUser2Lu-in-0.destination=user-manager
spring.cloud.stream.bindings.catchUser2Lu-in-0.group=luxue
