# 激活组合的profiles
#spring.profiles.include=bus.disable,bustream.kafka.binders
spring.profiles.include=bus.disable,bustream.rabbit.binders

#Function配置
spring.cloud.function.definition=addUser2;catchUser2

#Producer端Channel配置
#为Channel指定Binder，这将决定Channel使用哪个MQ
#spring.cloud.stream.bindings.addUser2-out-0.binder=kafkaCluster
spring.cloud.stream.bindings.addUser2-out-0.binder=rabbitCluster
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.addUser2-out-0.destination=user-manager
spring.cloud.stream.bindings.addUser2-out-0.producer.error-channel-enabled=true


#Consumer端Channel配置
#为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
#spring.cloud.stream.bindings.catchUser2-in-0.binder=kafkaCluster
spring.cloud.stream.bindings.catchUser2-in-0.binder=rabbitCluster
## 属于 Stream Binding的通用配置
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.catchUser2-in-0.destination=user-manager
#queue的后缀, 必须带有业务含义；在topic模式下其还作为分组
spring.cloud.stream.bindings.catchUser2-in-0.group=repayBack
