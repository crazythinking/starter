# 自定义Binder，名称为rabbitCluster
spring.cloud.stream.binders.kafka1.type=kafka
# 自定义Binder必须保持此配置，以确保同类型的默认Binder和Binding不会被覆盖，同时确保默认兜底逻辑有效
spring.cloud.stream.binders.kafka1.default-candidate=false
spring.cloud.stream.binders.kafka1.environment.spring.kafka.bootstrap-servers=${spring.kafka.bootstrap-servers}