#Producer端Channel配置

#为Channel指定Binder，这将决定Channel使用哪个MQ，指定默认的RabbitMQ Binder
#spring.cloud.stream.bindings.user-outer.binder=rabbit
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
#spring.cloud.stream.bindings.user-outer.destination=test.stream.bridge
# kafka 的 topic 对应的就是 rabbitmq 的 queue
spring.cloud.stream.bindings.user-outer.destination=test.stream.bridge.userType1
#通过指定routing-key-expression从MessageHeader中获取自定义key“messageType”，作为routeKey
#spring.cloud.stream.rabbit.bindings.user-outer.producer.routing-key-expression=headers.messageType
spring.cloud.stream.bindings.user-outer.producer.partition-count=3

spring.cloud.stream.kafka.bindings.user-outer.producer.configuration.client.id=user-outer