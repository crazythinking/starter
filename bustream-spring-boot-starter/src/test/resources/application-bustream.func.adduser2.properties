#Producer端Channel配置

#为Channel指定Binder，这将决定Channel使用哪个MQ
#spring.cloud.stream.bindings.addUser2-out-0.binder=kafka
#spring.cloud.stream.bindings.addUser2-out-0.binder=rabbit
spring.cloud.stream.bindings.addUser2-out-0.binder=rabbit1
#在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；同时destination又决定了exchange/topic的命名
spring.cloud.stream.bindings.addUser2-out-0.destination=user-manager
#spring.cloud.stream.rabbit.bindings.addUser2-out-0.producer.routing-key=#

# 当不使用默认binder（如kafka,rabbit,rocketmq等）或运行时注入多个binder时，消费端必须显示配置如下：
spring.cloud.stream.bindings.addUser2-out-0.producer.error-channel-enabled=${spring.cloud.stream.default.producer.error-channel-enabled}

# RabbitMQ生产端特性配置
spring.cloud.stream.rabbit.bindings.addUser2-out-0.producer.exchange_type=${spring.cloud.stream.rabbit.default.producer.exchange_type}
spring.cloud.stream.rabbit.bindings.addUser2-out-0.producer.declare-exchange=${spring.cloud.stream.rabbit.default.producer.declare-exchange}
spring.cloud.stream.rabbit.bindings.addUser2-out-0.producer.bind-queue=${spring.cloud.stream.rabbit.default.producer.bind-queue}
spring.cloud.stream.rabbit.bindings.addUser2-out-0.producer.auto-bind-dlq=${spring.cloud.stream.rabbit.default.producer.auto-bind-dlq}

# Kafka生产端特性配置
spring.cloud.stream.kafka.bindings.addUser2-out-0.producer.bufferSize=${spring.cloud.stream.kafka.default.producer.bufferSize}
spring.cloud.stream.kafka.bindings.addUser2-out-0.producer.batchTimeout=${spring.cloud.stream.kafka.default.producer.batchTimeout}
