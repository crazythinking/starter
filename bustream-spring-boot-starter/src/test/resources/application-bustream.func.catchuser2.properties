#Consumer端Channel配置

# 为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
spring.cloud.stream.bindings.catchUser2-in-0.binder=kafka
#spring.cloud.stream.bindings.addUser2-out-0.binder=rabbit

## 属于 Stream Binding的通用配置
# destination就是指定exchange/topic; 在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式
#spring.cloud.stream.bindings.catchUser2-in-0.destination=test.stream.bridge
# 当设置spring.cloud.stream.rabbit.default.consumer.queue-name-group-only=true时，group可直接为Consumer指定Queue
#spring.cloud.stream.bindings.catchUser2-in-0.group=test.stream.bridge.userType2
# 如果只指定group，不绑定routeKey，则默认routeKey=“#”，将消费Exchange：test.stream.bridge中的所有消息
#spring.cloud.stream.rabbit.bindings.catchUser2-in-0.consumer.binding-routing-key=type2

# kafka 的 topic 对应的就是 rabbitmq 的 queue
spring.cloud.stream.bindings.catchUser2-in-0.destination=test.stream.bridge.userType2
# 在kafka环境中 group 只用于指定服务实例所属的逻辑组，多个实例时，只有一个实例能够消费destination指定topic中的消息
spring.cloud.stream.bindings.catchUser2-in-0.group=user2
# 不指定dlq-name，将默认使用“error.$destination”
spring.cloud.stream.kafka.bindings.catchUser2-in-0.consumer.dlq-name=test.stream.bridge.userType2.dlq
# client id 为了监控区分不同客户端
#spring.cloud.stream.kafka.bindings.catchUser2-in-0.consumer.configuration.client.id=catchUser2
