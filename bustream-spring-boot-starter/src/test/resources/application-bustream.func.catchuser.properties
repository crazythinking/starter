#Consumer端Channel配置

# 为Channel指定Binder，这将决定Channel使用哪个MQ，如果不指定默认为default-binder
# spring.cloud.stream.bindings.catchUser-in-0.binder=kafka
#spring.cloud.stream.bindings.catchUser-in-0.binder=rabbit
## 属于 Stream Binding的通用配置
# 在Function模式下如果不指定destination，将默认使用“functionName-in/out-n”的模式；即destination就是exchange/topic的命名
spring.cloud.stream.bindings.catchUser-in-0.destination=test.stream.bridge
# 标识该Consumer将指定消费Queue：test.stream.bridge.repqyBack内的消息
spring.cloud.stream.bindings.catchUser-in-0.group=userType1
# 如果只指定group，不绑定routeKey，则默认routeKey=“#”，将消费Exchange：test.stream.bridge中的所有消息
spring.cloud.stream.rabbit.bindings.catchUser-in-0.consumer.binding-routing-key=type1
