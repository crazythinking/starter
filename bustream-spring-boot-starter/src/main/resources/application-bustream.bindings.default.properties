# Spring cloud stream 默认的通用配置，与消息组件无关
# BindingServiceProperties.bindings 的默认配置
# 如：spring.cloud.stream.bindings.k1 为前缀的配置会被这些配置兜底，但如果上下文中注入了多个同类型的Binder时会失效
#spring.cloud.stream.bindings.k1.contentType=application/json
# 默认异常消息处理Bean
spring.cloud.stream.default.error-handler-definition=globalMessageError

# 消费者通用默认配置
# 默认业务异常不进行重试
spring.cloud.stream.default.consumer.retryable-exceptions.net.engining.pg.support.core.exception.ErrorMessageException=false

# 生产者通用默认配置
spring.cloud.stream.default.producer.error-channel-enabled=true