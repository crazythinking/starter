# Spring cloud stream 默认的通用配置，与消息组件无关
# 默认(BindingServiceProperties)的定义
spring.cloud.stream.default.contentType=application/json

# 消费者通用默认配置
# 当消息消费失败时，尝试消费该消息的最大次数（消息消费失败后，发布者会重新投递）。默认3
spring.cloud.stream.default.consumer.maxAttempts=3
# 消息消费失败后重试消费消息的初始化间隔时间。默认1s，即第一次重试消费会在1s后进行
spring.cloud.stream.default.consumer.backOffInitialInterval=1000
# 相邻两次重试之间的间隔时间的倍数。默认2，即第二次是第一次间隔时间的2倍，第三次是第二次的2倍
spring.cloud.stream.default.consumer.backOffMultiplier=2
# 下一次尝试重试的最大时间间隔，默认为10000ms，即10s
spring.cloud.stream.default.consumer.backOffMaxInterval=10000
# 默认业务异常不进行重试
spring.cloud.stream.default.consumer.retryable-exceptions.net.engining.pg.support.core.exception.ErrorMessageException=false

# 生产者通用默认配置
spring.cloud.stream.default.producer.error-channel-enabled=true