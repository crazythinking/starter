# 按照spring cloud stream的默认逻辑，只有使用默认Binder配置的情况下default配置才能起到兜底作用
spring.profiles.include=kafka,bustream.bindings.default

# Spring cloud bus 生产者和消费者的Binding属性的默认约定配置： 针对于Kafka的特性
# 属于特定于Kafka的Binding(KafkaExtendedBindingProperties),不是通用的; 如果涉及到mq的转换则不可用; 同样以key的方式指定配置，默认为default
# binding的key为default，如果未特别配置<binding-name>相关的参数，则使用此default的配置

#消费者端默认配置
#当Kafka中没有初始偏移量或服务器上不再存在当前consumer对应偏移量时的策略
spring.cloud.stream.kafka.default.consumer.startOffset=${spring.kafka.consumer.auto-offset-reset}
#是否启用DLQ，默认false；如果打开DLQ，其默认TopicName为error.<destination>.<group>，且失败的Event会被发送到DLQ中与原始Event相同的分区号
spring.cloud.stream.kafka.default.consumer.enableDlq=true
#当启用DLQ时，通常Kafka的DLQ只用于处理异常的消息，因此数量不会很大，可以使用此参数控制DLQ的分区数量
spring.cloud.stream.kafka.default.consumer.dlqPartitions=1
#指示是否需要填充标准Header，允许值：none, id, timestamp, or both；默认none
spring.cloud.stream.kafka.default.consumer.standardHeaders=both

#生产者端默认配置
spring.cloud.stream.kafka.default.producer.bufferSize=${spring.kafka.producer.batch-size}
#默认0，指定producer在发送批量消息前等待的时间
spring.cloud.stream.kafka.default.producer.batchTimeout=${spring.kafka.producer.properties.linger.ms}