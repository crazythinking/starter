spring.profiles.include=kafka

# Kafka特定的Binder(BindingServiceProperties)配置
spring.cloud.stream.binders.kafkaCluster.type=kafka
# Kafka特定Binder(KafkaBinderConfigurationProperties)
# 以Binder的名称为Key所对应的(BindingServiceProperties#binders -> BinderProperties)
# KafkaBinderConfigurationProperties会自动注入KafkaProperties
spring.cloud.stream.binders.kafkaCluster.environment.spring.cloud.stream.kafka.binder.brokers=${spring.kafka.bootstrap-servers}
spring.cloud.stream.binders.kafkaCluster.environment.spring.cloud.stream.kafka.binder.healthTimeout=5
spring.cloud.stream.binders.kafkaCluster.environment.spring.cloud.stream.kafka.binder.autoCreateTopics=true

