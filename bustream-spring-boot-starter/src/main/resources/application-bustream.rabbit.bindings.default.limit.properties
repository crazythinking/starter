# 该配置只针对没有Config权限的RabbitMQ用户; 所有自动Declare行为都不做，全部事先手动创建好
# 按照spring cloud stream的默认逻辑，只有使用默认Binder配置的情况下default配置才能起到兜底作用
spring.profiles.include=rabbit

# Spring cloud bus 生产者和消费者的Binding属性的默认约定配置：针对于RabbitMq的特性
# 属于特定于RabbitMq的Binding(RabbitExtendedBindingProperties),不是通用的,如果涉及到mq的转换则不可用; 同样以key的方式指定配置，默认为default
# binding的key为default，如果未特别配置<binding-name>相关的参数，则使用此default的配置兜底
# 消费者端默认配置
# 自动ack
spring.cloud.stream.rabbit.default.consumer.acknowledgeMode=AUTO
# 不自动声明exchange，queue和绑定死信队列
spring.cloud.stream.rabbit.default.consumer.declare-exchange=false
spring.cloud.stream.rabbit.default.consumer.bind-queue=false
spring.cloud.stream.rabbit.default.consumer.auto-bind-dlq=false
spring.cloud.stream.rabbit.default.consumer.republishToDlq=true
# queue的名称只使用group，不使用destination.group
spring.cloud.stream.rabbit.default.consumer.queue-name-group-only=true
# spring-amqp会默认设为true，这里设回false，是为了如果当前连接断开未获取到queue的情况下，不作为致命错误，而是让container不断重试，直到恢复
spring.cloud.stream.rabbit.default.consumer.missing-queues-fatal=false

# 生产者端默认配置
spring.cloud.stream.rabbit.default.producer.exchangeType=topic
# 不自动声明exchange，queue和绑定死信队列
spring.cloud.stream.rabbit.default.producer.declare-exchange=false
spring.cloud.stream.rabbit.default.producer.bind-queue=false
spring.cloud.stream.rabbit.default.producer.auto-bind-dlq=false
spring.cloud.stream.rabbit.default.producer.republishToDlq=false
