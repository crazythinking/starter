# 按照spring cloud stream的默认逻辑，只有使用默认Binder配置的情况下default配置才能起到兜底作用
spring.profiles.include=kafka

# kafka binder配置
#全局最小分区数，默认1，这个值需要结合消费者的数量，期望的吞吐量，p端可达的吞吐量，c端可达的吞吐量，等因素来评估;
# 可以被spring.cloud.stream.bindings.<x>.producer.partition-count 覆盖
spring.cloud.stream.kafka.binder.minPartitionCount=1


# Spring cloud bus 生产者和消费者的Binding属性的默认约定配置： 针对于Kafka的特性
# 属于特定于Kafka的Binding(KafkaExtendedBindingProperties),不是通用的; 如果涉及到mq的转换则不可用; 同样以key的方式指定配置，默认为default
# binding的key为default，如果未特别配置<binding-name>相关的参数，则使用此default的配置

#消费者端默认配置
# 默认true，Topic分区在ConsumerGroup的成员之间自动重新平衡。如果false，则每个consumer需要配置相应的instanceCount和instanceIndex
spring.cloud.stream.kafka.default.consumer.autoRebalanceEnabled=true
#是否自动提交Offset，默认true
spring.cloud.stream.kafka.default.consumer.autoCommitOffset=${spring.kafka.consumer.enable-auto-commit}
#仅当autoCommitOffset设置为true时才有效
#如果为false，它会抑制导致错误Event的自动提交，并且仅对成功Event进行提交。 它允许流从最后成功处理的Event自动重播，以防出现持续故障
#如果true，则它始终自动提交（如果启用了自动提交）
#如果未设置（默认），它实际上具有与enableDlq作用相同，如果错误消息被发送到DLQ则自动提交，否则不提交
#spring.cloud.stream.kafka.default.consumer.autoCommitOnError=true
#默认false；如果true，且当autoCommitOffset为true，则每消费一个Event都会Ack，对性能有影响，但可避免重复消费
spring.cloud.stream.kafka.default.consumer.ackEachRecord=false
#是否将consumer的偏移量重置为startOffset提供的值。如果提供了KafkaBindingRebalanceListener则该参数必须为false
spring.cloud.stream.kafka.default.consumer.resetOffsets=false
#当Kafka中没有初始偏移量或服务器上不再存在当前consumer对应偏移量时的策略
spring.cloud.stream.kafka.default.consumer.startOffset=${spring.kafka.consumer.auto-offset-reset}
#是否启用DLQ，默认false；如果打开DLQ，其默认TopicName为error.<destination>.<group>，且失败的Event会被发送到DLQ中与原始Event相同的分区号
spring.cloud.stream.kafka.default.consumer.enableDlq=true
#当启用DLQ时，通常Kafka的DLQ只用于处理异常的消息，因此数量不会很大，可以使用此参数控制DLQ的分区数量
spring.cloud.stream.kafka.default.consumer.dlqPartitions=1
#作为DLQ的Producer配置，默认使用 Default Kafka producer properties
#spring.cloud.stream.kafka.default.consumer.dlqProducerProperties=
#其他附加的 Kafka consumer properties
#spring.cloud.stream.kafka.default.consumer.configuration=
#指示是否需要填充标准Header，允许值：none, id, timestamp, or both；默认none
spring.cloud.stream.kafka.default.consumer.standardHeaders=both
#RecordMessageConverter实现的BeanName，用于替换默认的MessagingMessageConverter
#spring.cloud.stream.kafka.default.consumer.converterBeanName=
#指定间隔毫秒时间内未收到任何消息时产生事件(ListenerContainerIdleEvent)，默认30000；
spring.cloud.stream.kafka.default.consumer.idleEventInterval=30000
#附加的TopicProperties
#spring.cloud.stream.kafka.default.consumer.topic.properties=
#以Map<Integer, List<Integer>>的形式分配Partition与ReplicaAssignment的映射关系
#spring.cloud.stream.kafka.default.consumer.topic.replicas-assignment=
#副本数量，默认none，当topic.replicas-assignment配置时，此参数无效
#spring.cloud.stream.kafka.default.consumer.topic.replication-factor=
#用于Pollable Consumer的轮询所用的超时时间，默认5000毫秒
spring.cloud.stream.kafka.default.consumer.pollTimeout=5000

#生产者端默认配置
spring.cloud.stream.kafka.default.producer.bufferSize=${spring.kafka.producer.batch-size}
#是否同步，默认false
spring.cloud.stream.kafka.default.producer.sync=false
#接受SpEL表达式，用于评估启用同步Publish(sync=true)时等待Ack的时间；
#spring.cloud.stream.kafka.default.producer.sendTimeoutExpression=none
#默认0，指定producer在发送批量消息前等待的时间
spring.cloud.stream.kafka.default.producer.batchTimeout=${spring.kafka.properties.linger.ms}
#接受SpEL表达式，用于从Spring Messaging Headers中指定的key填充到Kafka Producer Header中，默认none
#spring.cloud.stream.kafka.default.producer.messageKeyExpression=
#默认*，用于过滤Spring Messaging Headers中的Key的表达式；如：“!ask,as*”，Header中将包含“ash”，而排除“ask”
#spring.cloud.stream.kafka.default.producer.headerPatterns=
#其他附加的 Kafka producer properties
#spring.cloud.stream.kafka.default.producer.configuration=
#附加的TopicProperties
#spring.cloud.stream.kafka.default.producer.topic.properties=
#以Map<Integer, List<Integer>>的形式分配Partition与ReplicaAssignment的映射关系
#spring.cloud.stream.kafka.default.producer.topic.replicas-assignment=
#副本数量，默认none，当topic.replicas-assignment配置时，此参数无效
#spring.cloud.stream.kafka.default.producer.topic.replication-factor=
#默认false，为true时将使用MessageHeader中“KafkaHeaders.TOPIC”的值替换默认的TopicName
spring.cloud.stream.kafka.default.producer.useTopicHeader=false
#成功的发送结果Event发送到指定的MessageChannel(BeanName)；Bean必须存在于应用程序上下文中。默认null
#spring.cloud.stream.kafka.default.producer.recordMetadataChannel=
spring.cloud.stream.kafka.default.producer.compression=${spring.kafka.producer.compression-type}
#当关闭producer时等待的超时时间，默认30秒
spring.cloud.stream.kafka.default.producer.closeTimeout=30
