# 按照spring cloud stream的默认逻辑，只有使用默认Binder配置的情况下default配置才能起到兜底作用
spring.profiles.include=rabbit

# Spring cloud bus 生产者和消费者的Binding属性的默认约定配置：针对于RabbitMq的特性
# 属于特定于RabbitMq的Binding(RabbitExtendedBindingProperties),不是通用的,如果涉及到mq的转换则不可用; 同样以key的方式指定配置，默认为default
# binding的key为default，如果未特别配置<binding-name>相关的参数，则使用此default的配置兜底
# 消费者端默认配置
spring.cloud.stream.rabbit.default.consumer.acknowledgeMode=AUTO
# 将queue绑定到exchange时使用的routing key，默认'#'
# spring.cloud.stream.rabbit.default.consumer.bindingRoutingKey=testKey1
# ms, 默认不做限制, 消息在队列中最大的存活时间; 当消息滞留超过ttl时会被当成消费失败消息, 即会被转发到死信队列或丢弃
spring.cloud.stream.rabbit.default.consumer.ttl=1800000
# 以下配置只用于死信相关
# 是否自动声明死信队列(DLQ)并将其绑定到死信交换机(DLX),默认是false
spring.cloud.stream.rabbit.default.consumer.autoBindDlq=true
spring.cloud.stream.rabbit.default.consumer.republishToDlq=true
# 默认destination
#spring.cloud.stream.rabbit.default.consumer.deadLetterExchange=
# 默认destination + dlq
#spring.cloud.stream.rabbit.default.consumer.deadLetterQueueName=
# 默认destination + group
#spring.cloud.stream.rabbit.default.consumer.deadLetterRoutingKey=
# 队列所有 customer 下线, 且在过期时间段内 queue 没有被重新声明, 多久之后队列会被销毁, 注意, 不管队列内有没有消息. 默认不设置
#spring.cloud.stream.rabbit.default.consumer.dlqExpires=30000
# 是否声明为惰性队列（Lazy Queue）.默认false
#spring.cloud.stream.rabbit.default.consumer.dlqLazy=false
# 队列中消息数量的最大限制. 默认不限制
#spring.cloud.stream.rabbit.default.consumer.dlqMaxLength=100000
# 队列所有消息总字节的最大限制. 默认不限制
#spring.cloud.stream.rabbit.default.consumer.dlqMaxLengthBytes=100000000
# 队列的消息可以设置的最大优先级. 默认不设置
#spring.cloud.stream.rabbit.default.consumer.dlqMaxPriority=255
# 队列的消息的过期时间. 默认不限制
#spring.cloud.stream.rabbit.default.consumer.dlqTtl=1000000
# spring-amqp会默认设为true，这里设回false，是为了如果当前连接断开未获取到queue的情况下，不作为致命错误，而是让container不断重试，直到恢复
spring.cloud.stream.rabbit.default.consumer.missing-queues-fatal=false

# 生产者端默认配置
spring.cloud.stream.rabbit.default.producer.exchangeType=topic
# 生产者配置RabbitMq的动态路由键, 需要在生产者端组装消息时指定headers.type的值
#spring.cloud.stream.rabbit.default.producer.routingKeyExpression=headers.type
# 固定的routing key值
#spring.cloud.stream.rabbit.default.producer.routingKeyExpression=testKey1