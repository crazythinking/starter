spring.profiles.include=rabbit
# 自定义Binder，名称为rabbitCluster
spring.cloud.stream.binders.rabbitCluster.type=rabbit
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.addresses=${spring.rabbitmq.addresses}
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.cache.channel.size=10
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.cache.channel.checkout-timeout=1s
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.cache.connection.mode=channel
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.connection-timeout=3s
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.password=${spring.rabbitmq.password}
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.username=${spring.rabbitmq.username}
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.virtual-host=${spring.rabbitmq.virtual-host}
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.publisher-confirm-type=${spring.rabbitmq.publisher-confirm-type}
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.publisher-returns=${spring.rabbitmq.publisher-returns}
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.template.mandatory=${spring.rabbitmq.template.mandatory}
spring.cloud.stream.binders.rabbitCluster.environment.spring.rabbitmq.address-shuffle-mode=${spring.rabbitmq.address-shuffle-mode}

