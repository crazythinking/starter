spring:
  application:
    name: kettle-starter-test
  main:
    allow-bean-definition-overriding: true

pg:
  kettle:
    enabled: true
    config:
      kettle-log-level: DETAIL
      kettle-repo-id: KettleFileRepository
      kettle-repo-path: .\src\test\resources
      kettle-repo-name: test
      kettle-map:
        FILE-KTR:
          name: test_num.ktr
          params:
            a: b
            c: d
        FILE-KJB:
          name: test_no.kjb
          params:
            a: b
            c: d
        FILE-REPO:
          name: test_repo
          subdirectory:
          params:
            a: b
            c: d

logging:
  level:
    root: info
    net.engining: trace