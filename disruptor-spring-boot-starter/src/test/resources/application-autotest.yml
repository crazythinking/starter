spring:
  application:
    name: disruptor-starter-test
  main:
    allow-bean-definition-overriding: true

pg:
  disruptor:
    grouped-disruptor:
      Event1-Group:
        batch-size: 1
        ring-buffer-size: 2048
        multi-producer: false
        wait-strategy: sleeping_wait
      Event2-Group:
        batch-size: 1
        ring-buffer-size: 3000

logging:
  level:
    root: info
    net.engining: info
