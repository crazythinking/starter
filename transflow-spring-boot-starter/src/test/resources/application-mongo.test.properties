spring.data.mongodb.database=ct-test
spring.data.mongodb.uri=mongodb://root:example@ubuntu2004-1:27017

pg.mongo.connection-pool.min-size=2
pg.mongo.cluster.server-selection-timeout=100
#将lob字段存储到mongodb，默认存储到db
gm.trans-flow.mongo-lob-enabled=true
#重试次数
gm.trans-flow.mongo-lob-max-attempts=2
#重试间隔毫秒数
gm.trans-flow.mongo-lob-back-off-period=100